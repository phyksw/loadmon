# LoadMonitor 린트 정책 — 실결함 중심 (스타일 소음 배제)
line-length = 120
target-version = "py311"

# 캐시는 배포 트리 밖(%TEMP%)에 둔다 — 트리 안에 생긴 .ruff_cache\ 가 "폴더 통째로 복사" 경로에
# 딸려 갔다(실측 6개). tools\lint.ps1 은 --no-cache 로 돌려 캐시 자체를 만들지 않는다.
cache-dir = "${TEMP}/LoadMonitor25-ruff_cache"

[lint]
# E/F: pyflakes·pycodestyle 오류, W: 경고(invalid escape 등), B: bugbear(실버그 패턴),
# UP: 파이썬 현대화(안전한 것만), C4: comprehension 실수
select = ["E", "F", "W", "B", "UP", "C4"]
ignore = [
    "E501",   # 한국어 리포트 문자열은 줄길이 예외
    "UP009",  # -*- coding -*- 선언 유지 (구형 도구 호환)
    "B023",   # 루프 클로저 — 사용처에서 즉시 소비하므로 안전
]

[lint.per-file-ignores]
# 수집 CSV 파서는 방어적 blind except가 설계 의도 (한 줄 오류로 전체 중단 금지)
"analyze/*.py" = ["E722"]
