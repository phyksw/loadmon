<p class="intro" id="lm27-intro">PC 사용·메일·일정·팀즈 기록으로 근무시간과 업무를 계산합니다. <b>투입 MM</b> = 일한 시간 ÷ (그 달 근무일 × 8h),
<b>로드율</b> = 일한 시간 ÷ 가용 시간(부재는 뺌). 기록은 이 PC 의 번들 폴더에만 두고, 팀에는 미리보기에서 가림을 정할 수 있는 팀 묶음만 보냅니다.</p>
